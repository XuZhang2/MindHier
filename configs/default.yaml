project:
  name: mindhier
  seed: 42
  output_root: outputs
  log_wandb: false
  wandb_project: mindhier

data:
  dataset: nsd
  nsd_root: data/nsd
  processed_root: data/processed
  subject: subj01
  mask: nsdgeneral
  image_size: 256
  num_workers: 8
  train_split: train
  val_split: val
  test_split: test
  normalize_fmri: true
  cache_clip_features: true

optimization:
  batch_size: 64
  epochs: 100
  learning_rate: 1.0e-4
  weight_decay: 1.0e-2
  warmup_steps: 1000
  grad_clip_norm: 1.0
  mixed_precision: bf16
  distributed: false

brainencoder:
  backbone: clip_vit_l14
  input_dim: null
  hidden_dim: 4096
  projection_dim: 768
  dropout: 0.1
  pooling: mlp
  clip_model: ViT-L-14
  clip_pretrained: openai
  clip_layers:
    - 6
    - 12
    - 18
    - 24
  loss:
    mse_weight: 1.0
    softclip_weight: 0.1
    softclip_temperature: 0.004
    layer_weights:
      6: 0.25
      12: 0.25
      18: 0.25
      24: 0.25
  checkpoint:
    resume: null
    save_every: 10
    monitor: val_loss

mindhier:
  tokenizer: vqvae
  image_size: 256
  patch_size: 16
  codebook_size: 4096
  code_dim: 32
  ar_model:
    hidden_dim: 1024
    depth: 24
    num_heads: 16
    mlp_ratio: 4.0
    dropout: 0.1
    attn_dropout: 0.0
  scales:
    - 1
    - 2
    - 3
    - 4
    - 5
    - 6
    - 8
    - 10
    - 13
    - 16
  guidance:
    type: scale_aware
    guidance_layers:
      - 6
      - 12
      - 18
      - 24
    cfg_scale: 3.0
    condition_dropout: 0.1
  loss:
    token_ce_weight: 1.0
    scale_loss_weights:
      1: 1.0
      2: 1.0
      4: 1.0
      8: 1.0
      16: 1.0
  checkpoint:
    resume: null
    save_every: 10
    monitor: val_clip_score

inference:
  num_samples: 4
  top_k: 900
  top_p: 0.95
  temperature: 1.0
  seed: 42
  save_intermediate_scales: false

evaluation:
  metrics:
    - clip_score
    - pixcorr
    - ssim
    - lpips
  clip_model: ViT-L-14
  best_of_n_metric: clip_score
